[workspace]
resolver = "2"

members = [
    "contracts/nexus",
    "contracts/soul",
    "contracts/zpay",
    "contracts/adapters/axelar",
    "contracts/github",
    "contracts/gig",
    "contracts/flow",
    "contracts/direct-sovereign",
]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
