[package]
name = "zolvency-verifier-solana"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]
name = "zolvency_verifier_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.0"
solana-axelar-gateway = { version = "1.1.0", features = ["cpi"] }
solana-axelar-gas-service = { version = "1.1.0", features = ["cpi"] }
borsh = "1.5.1"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
